frame.addEventListener('load',()=>{
 const d=frame.contentDocument;
 if(!d)return;
 const s=d.createElement('style');
 s.textContent=`
:root{--ink:#193329!important;--panna:#f6f3ea!important;--panna-card:#fffdf8!important;--pistacchio:#4e8a68!important;--pistacchio-dark:#173f2e!important;--amarena:#9a3e4b!important;--amarena-dark:#84343f!important;--caramello:#c99a52!important;--linea:#d7e1da!important;--grigio:#6e7d75!important;--ombra:0 8px 26px rgba(30,57,44,.07)!important}

header:after{content:"";position:absolute;right:-80px;top:-110px;width:470px;height:260px;border:1px solid rgba(255,255,255,.16);border-radius:50%;transform:rotate(-12deg);box-shadow:0 0 0 18px rgba(255,255,255,.025),0 0 0 36px rgba(255,255,255,.018);pointer-events:none}

.tabbar{position:relative!important;z-index:5!important;display:flex!important;gap:8px!important;padding:10px 20px 0!important;background:#123b2a!important;border-bottom:1px solid rgba(255,255,255,.08)!important}

`;
 d.head.appendChild(s);
 // Rimuove tutte le emoji, comprese quelle dei tab, senza alterare la logica.
 const clean=()=>{
   const w=d.createTreeWalker(d.body,NodeFilter.SHOW_TEXT),a=[];let n;
   while(n=w.nextNode())a.push(n);
   a.forEach(x=>x.nodeValue=x.nodeValue.replace(/\\p{Extended_Pictographic}|\\uFE0F/gu,""));
 };
 clean();
 // Titolo grafico e payoff, solo presentazione.
 const h=d.querySelector('header h1');
 if(h){
   h.innerHTML='<span>Gestione Ordini</span> <span style="color:#b9ee72;font-style:italic">Gelato</span><span style="opacity:.55;font-weight:400"> &nbsp;|&nbsp; build 55</span>';
 }
 const header=d.querySelector('header');
 if(header && !header.querySelector('.chatgpt-payoff')){
   const p=d.createElement('div');p.className='chatgpt-payoff';
   p.textContent="Ordini, consegne e controllo. Tutto in un'unica regia.";
   p.style.cssText='position:absolute;left:88px;bottom:18px;color:rgba(255,255,255,.78);font-size:.82rem;letter-spacing:.02em;z-index:3';
   header.appendChild(p);
 }
 const obs=new MutationObserver(clean);
 obs.observe(d.body,{childList:true,subtree:true});
});
