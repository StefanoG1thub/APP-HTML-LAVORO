frame.src='Gestione_Ordini_Gelato_260816.html';
frame.addEventListener('load',()=>{
 const d=frame.contentDocument;if(!d)return;
 const s=d.createElement('style');
 s.textContent=`

header>div:first-child:before{content:'LG';display:flex;align-items:center;justify-content:center;width:34px;height:34px;border:1px solid rgba(255,255,255,.22);border-radius:10px;background:rgba(255,255,255,.10);color:#fff;font-size:.72rem;font-weight:800;letter-spacing:.5px;flex:0 0 auto}
header>div:first-child{align-items:center!important}
header h1{font-size:1.18rem!important;letter-spacing:.8px!important;text-transform:uppercase!important;font-weight:750!important}header .sub{font-size:.78rem!important;opacity:.72!important;margin-top:5px!important}header button{background:rgba(255,255,255,.10)!important;border:1px solid rgba(255,255,255,.22)!important;border-radius:11px!important;transition:background .15s,transform .08s!important}header button:hover{background:rgba(255,255,255,.18)!important}
.tabbar{gap:6px!important;padding:10px 14px 0!important;background:#183f2f!important;border-bottom:1px solid rgba(255,255,255,.10)!important}.tabbar button{background:transparent!important;color:rgba(255,255,255,.72)!important;border:1px solid transparent!important;border-radius:11px 11px 0 0!important;padding:11px 17px!important;font-weight:650!important;transition:all .15s!important}.tabbar button:hover{background:rgba(255,255,255,.08)!important;color:#fff!important}.tabbar button.active{background:#f7f5ef!important;color:#214f3b!important;border-color:#f7f5ef!important;box-shadow:0 -1px 0 rgba(255,255,255,.25)!important}
main{padding:22px 18px 42px!important;max-width:1500px!important}.card{background:#fff!important;border:1px solid #e4e9e5!important;border-radius:16px!important;box-shadow:var(--ombra)!important;padding:20px!important;margin-bottom:17px!important}.card h2{color:#214f3b!important;font-size:1.08rem!important;margin-bottom:14px!important;letter-spacing:.1px!important}.card:hover{box-shadow:0 10px 30px rgba(27,52,40,.10)!important}
.row{gap:10px!important}
.btn{border-radius:11px!important;padding:11px 17px!important;font-weight:650!important;box-shadow:none!important;transition:all .14s!important}.btn:hover{transform:translateY(-1px)!important}.btn:active{transform:translateY(0)!important}.btn-primary{background:#3d7b5d!important;color:#fff!important}.btn-primary:hover{background:#2f6b50!important}.btn-secondary{background:#eef2ef!important;color:#214f3b!important;border:1px solid #dbe3dd!important}.btn-secondary:hover{background:#e4ebe6!important}.btn-ghost{background:#fff!important;color:#2f6b50!important;border:1.5px solid #79a48d!important}.btn-ghost:hover{background:#f2f7f3!important}.btn-danger{background:#9f3f49!important;color:#fff!important;border:1px solid #8d3540!important}.btn-danger:hover{background:#84343c!important}
select,input[type=text],input[type=number]{border:1.5px solid #d7e0da!important;border-radius:10px!important;background:#fff!important;color:#18352a!important;min-height:40px!important}select:hover,input[type=text]:hover,input[type=number]:hover{border-color:#9db7a7!important}select:focus,input:focus{outline:none!important;border-color:#6f9d84!important;box-shadow:0 0 0 3px rgba(61,123,93,.12)!important}.pill{background:#edf3ee!important;color:#28583f!important;border:1px solid #dbe8df!important}
.tablewrap{border:1px solid #dfe6e1!important;border-radius:13px!important;background:#fff!important;box-shadow:0 3px 12px rgba(27,52,40,.05)!important}table{font-size:.9rem!important}thead th{background:#214f3b!important;padding:12px 10px!important;font-weight:650!important;letter-spacing:.1px!important}thead th.rowlabel{background:#214f3b!important}tbody td{padding:9px 10px!important;border-bottom:1px solid #e8ece9!important}tbody tr:nth-child(even),tbody tr:nth-child(even) td.rowlabel{background:#f5f7f5!important}tbody tr:nth-child(odd),tbody tr:nth-child(odd) td.rowlabel{background:#fff!important}tbody tr:hover td,tbody tr:hover td.rowlabel{background:#edf5ef!important}tbody tr.cat-header td,tbody tr.cat-header td.rowlabel{background:#dce9e1!important;color:#214f3b!important;border-top:1px solid #cbdccf!important;border-bottom:1px solid #cbdccf!important;font-weight:750!important}tfoot tr.tot-riga td{background:#214f3b!important;border-top:2px solid #d6e0da!important;padding:10px!important}tfoot tr.tot-riga td.rowlabel{background:#214f3b!important}td.tot{color:#84343c!important;border-left:2px solid #e1e7e3!important;font-weight:800!important}td.qty-cell{color:#2f6b50!important;font-weight:700!important}td.qty-zero{color:#c2cbc5!important}
.empty-state{padding:54px 22px!important;color:#718078!important}.empty-state .icon{font-size:0!important;width:76px;height:76px;margin:0 auto 16px;border-radius:22px;background:#e6f0e9;position:relative;box-shadow:inset 0 0 0 1px #d6e7dc}.empty-state .icon:after{content:'+';font-size:32px;font-weight:300;color:#3d7b5d;position:absolute;inset:0;display:grid;place-items:center}
.note-box{background:#fbf6e9!important;border-left:4px solid #c58a45!important;color:#675328!important;border-radius:0 10px 10px 0!important;padding:11px 14px!important}.section-title{color:#718078!important;font-size:.72rem!important;letter-spacing:1px!important}.badge{border-radius:999px!important;padding:4px 9px!important;font-size:.68rem!important}.modal-backdrop{background:rgba(18,34,26,.62)!important;backdrop-filter:blur(4px)!important}.modal{background:#f7f5ef!important;border-radius:20px 20px 0 0!important;box-shadow:0 -8px 30px rgba(0,0,0,.18)!important}.dropzone{border:2px dashed #75a18b!important;background:#eef6f0!important;border-radius:14px!important}.toast{background:#18352a!important;border-radius:12px!important;box-shadow:0 8px 24px rgba(0,0,0,.18)!important}
.modal .btn-danger,.modal-actions .btn-danger{background:#9f3f49!important;color:#fff!important}
`;
 d.head.appendChild(s);
 const h=d.querySelector('header h1');if(h){h.firstChild.textContent='GESTIONE ORDINI GELATO ';}
 d.querySelectorAll('.empty-state .icon').forEach(x=>x.setAttribute('aria-hidden','true'));

 // Gerarchia visiva dei comandi: azzera/reset sempre leggibile e chiaramente distruttivo.
 const marcaComandi=()=>{
   d.querySelectorAll('button').forEach(b=>{
     const t=(b.textContent||'').replace(/\s+/g,' ').trim().toLowerCase();
     if(t==='azzera' || t.includes('azzera inventario') || t.includes('azzera dati')){
       b.classList.add('chatgpt-reset-btn');
       b.style.setProperty('background','#9f3f49','important');
       b.style.setProperty('color','#fff','important');
       b.style.setProperty('border','1px solid #84343c','important');
       b.style.setProperty('font-weight','750','important');
     }
     if(t.includes('stampa') || t.includes('esporta excel')) b.classList.add('chatgpt-output-btn');
   });
 };
 marcaComandi();
 new MutationObserver(marcaComandi).observe(d.body,{childList:true,subtree:true});

 // Elimina solo le emoji decorative dai titoli/testate, senza toccare il testo funzionale.
 d.querySelectorAll('h1,h2,h3,.section-title').forEach(el=>{
   el.childNodes.forEach(n=>{if(n.nodeType===3)n.textContent=n.textContent.replace(/[🍨🚛⚖️🧊📦📋]/g,'');});
 });
});
</script>
