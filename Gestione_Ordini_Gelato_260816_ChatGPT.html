 d.querySelectorAll('.empty-state .icon').forEach(x=>x.setAttribute('aria-hidden','true'));

 // Gerarchia visiva dei comandi: azzera/reset sempre leggibile e chiaramente distruttivo.
 const marcaComandi=()=>{
   d.querySelectorAll('button').forEach(b=>{
     const t=(b.textContent||'').replace(/\s+/g,' ').trim().toLowerCase();
     if(t==='azzera' || t.includes('azzera inventario') || t.includes('azzera dati')){
       b.classList.add('chatgpt-reset-btn');
       b.style.setProperty('background','#9f3f49','important');
       b.style.setProperty('color','#fff','important');
       b.style.setProperty('border','1px solid #84343c','important');
       b.style.setProperty('font-weight','750','important');
     }
     if(t.includes('stampa') || t.includes('esporta excel')) b.classList.add('chatgpt-output-btn');
   });
 };
 marcaComandi();
 new MutationObserver(marcaComandi).observe(d.body,{childList:true,subtree:true});

 // Elimina TUTTE le emoji dalla UI, incluse quelle inserite dinamicamente nei tab.
 const pulisciEmoji=(el)=>{
   if(!el || el.nodeType!==1) return;
   const walker=d.createTreeWalker(el,NodeFilter.SHOW_TEXT);
   const nodes=[]; let n;
   while(n=walker.nextNode()) nodes.push(n);
   nodes.forEach(t=>{t.nodeValue=t.nodeValue.replace(/\\p{Extended_Pictographic}|\\uFE0F/gu,'');});
 };
 pulisciEmoji(d.body);
 new MutationObserver(()=>pulisciEmoji(d.body)).observe(d.body,{childList:true,subtree:true});
});

<script id="chatgpt-redesign-v3-script">
(()=>{const d=document;
 const clean=(root)=>{
   const w=d.createTreeWalker(root,NodeFilter.SHOW_TEXT);const a=[];let n;
   while(n=w.nextNode())a.push(n);
   a.forEach(x=>x.nodeValue=x.nodeValue.replace(/\\p{Extended_Pictographic}|\\uFE0F/gu,""));
 };
 clean(d.body);
 const h=d.querySelector("header");
 if(h){
   const first=h.querySelector(":scope>div:first-child");
   if(first && !first.querySelector(".chatgpt-gelato-mark")){
     const mark=d.createElement("div");mark.className="chatgpt-gelato-mark";
     mark.innerHTML='<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M10 29h28l-2.2 9.5A4.5 4.5 0 0 1 31.4 42H16.6a4.5 4.5 0 0 1-4.4-3.5L10 29Z" fill="#FFFDF8"/><path d="M13 29c.7-7.5 5.7-12 11-12s10.3 4.5 11 12" stroke="#B9EE72" stroke-width="3" stroke-linecap="round"/><path d="M17 17c.2-3.1 2.1-5.4 4.8-5.4 2.8 0 4.9 2.3 4.9 5.4" stroke="#C99A52" stroke-width="3" stroke-linecap="round"/><path d="M15 34h18" stroke="#24583F" stroke-width="2.2" stroke-linecap="round"/></svg>';
     first.prepend(mark);
   }
   let title=h.querySelector("h1");
   if(title){
     const txt=title.textContent.replace(/\\s+/g," ").trim();
     title.innerHTML='<span>Gestione Ordini</span> <span class="brand-accent">Gelato</span>';
   }
   if(!h.querySelector(".chatgpt-tagline")){
     const p=d.createElement("div");p.className="chatgpt-tagline";
     p.textContent="Ordini, consegne e controllo. Tutto in un'unica regia.";
     h.appendChild(p);
   }
 }
 // Mantiene le diciture funzionali e interviene solo sulla presentazione.
 const obs=new MutationObserver(()=>clean(d.body));
 obs.observe(d.body,{childList:true,subtree:true});
})();
</script></body>
